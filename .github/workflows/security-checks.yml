# Added by Domo remediation — invokes the shared security workflow.
name: Domo policy check
on:
  workflow_call:
    inputs:
      repository_fixture:
        description: Path to a JSON repository record used for policy evaluation.
        required: false
        type: string
        default: inventory/fixtures/checkout-api.json
      head_sha:
        description: Head SHA of the pull request under evaluation. Used as the Check Run head_sha.
        required: false
        type: string
        default: ""

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29  # v4.1.6

      - name: Set up Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate a small synthetic fleet
        env:
          DOMO_FLEET_SIZE: "1000"
        run: npm run generate

      - name: Evaluate policies
        env:
          DOMO_REPO_FIXTURE: ${{ inputs.repository_fixture }}
          DOMO_HEAD_SHA: ${{ inputs.head_sha != '' && inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: npm run evaluate

      - name: Publish Check Runs to the pull request
        if: github.event.pull_request != null
        env:
          DOMO_ALLOW_NETWORK: "1"
          DOMO_GITHUB_ORG: governance-demo
          DOMO_GITHUB_TOKEN: ${{ secrets.DOMO_GITHUB_TOKEN }}
          DOMO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run publish-checks -- --repo ${{ github.event.repository.name }}
        continue-on-error: true

      - name: Publish evidence artifact
        if: always()
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b  # v4.3.4
        with:
          name: domo-evidence
          path: evidence/
